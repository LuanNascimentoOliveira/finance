server:
  servlet:
    context-path: /api/finance
  port: 8080

spring:
  application:
    name: finance

  datasource:
    url: jdbc:mysql://localhost:3306/finance?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true